<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HSL Kruunusillat Countdown</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #003b6f;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* KOKO NÄYTTÖ */
.container {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 64.02% 35.98%;
}

/* VASEN PUOLI */
.left {
    min-width: 0;
    min-height: 0;
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    color: white;

    background: linear-gradient(
        145deg,
        #003b6f 0%,
        #005b9f 55%,
        #007ac9 100%
    );
}

/* HILLITTY TAUSTAKUVIO */
.left::before {
    content: "";
    position: absolute;

    width: 70vmin;
    aspect-ratio: 1 / 1;

    border-radius: 50%;
    border: 6vmin solid rgba(255,255,255,0.035);

    right: -22%;
    top: -20%;
}

/* SISÄLTÖ */
.content {
    position: relative;
    z-index: 2;

    width: 90%;
    height: 85%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
}

/* OTSIKKO */
#headline {
    font-size: clamp(1rem, 3vw, 4rem);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;

    margin-bottom: 5vh;

    text-shadow: 0 0.4vh 1.4vh rgba(0,0,0,.15);
}

/* PÄIVÄT */
.big-days {
    font-size: clamp(5rem, 15vw, 18rem);
    font-weight: 900;
    line-height: .85;

    letter-spacing: -0.035em;

    font-variant-numeric: tabular-nums;

    text-shadow: 0 1vh 3vh rgba(0,0,0,.20);
}

.days-label {
    font-size: clamp(1rem, 1.7vw, 2.3rem);
    font-weight: 700;
    letter-spacing: .35em;

    margin-top: 2vh;
    margin-bottom: 6vh;
}

/* AIKA */
.time-row {
    width: min(85%, 60vw);

    display: grid;
    grid-template-columns:
        minmax(0, 1fr)
        auto
        minmax(0, 1fr)
        auto
        minmax(0, 1fr);

    align-items: start;
    gap: 1vw;
}

.time-box {
    min-width: 0;
    text-align: center;
}

.time-number {
    font-size: clamp(2rem, 4.6vw, 6rem);
    font-weight: 700;
    line-height: 1;

    font-variant-numeric: tabular-nums;
}

.time-label {
    font-size: clamp(.5rem, .85vw, 1.2rem);
    font-weight: 600;

    letter-spacing: .12em;

    margin-top: 1.2vh;

    opacity: .85;
}

.separator {
    font-size: clamp(2rem, 4vw, 5rem);
    font-weight: 300;
    line-height: .9;

    opacity: .7;
}

/* INFO */
.footer {
    position: absolute;

    bottom: 4vh;
    left: 5%;
    width: 90%;

    text-align: center;

    font-size: clamp(.7rem, 1.1vw, 1.5rem);
    font-weight: 700;
    letter-spacing: .22em;

    opacity: .85;
}

/* OIKEA PUOLI */
.right {
    min-width: 0;
    min-height: 0;

    position: relative;

    overflow: hidden;

    background: #003b6f;
}

/* GIF täyttää oman 35,98 % alueensa */
.right img {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
    object-position: center;
}

/* VARMISTUS KAPEILLE NÄYTÖILLE */
@media (max-aspect-ratio: 4/3) {

    #headline {
        font-size: clamp(1rem, 2.8vw, 3rem);
        margin-bottom: 4vh;
    }

    .big-days {
        font-size: clamp(4rem, 13vw, 13rem);
    }

    .days-label {
        margin-bottom: 4vh;
    }

    .time-row {
        width: 90%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="left">

        <div class="content">

            <div id="headline">
                Ratikkaliikenne alkaa
            </div>

            <div class="big-days">
                <span id="days">0</span>
            </div>

            <div class="days-label">
                PÄIVÄÄ
            </div>

            <div class="time-row">

                <div class="time-box">
                    <div class="time-number" id="hours">00</div>
                    <div class="time-label">TUNTIA</div>
                </div>

                <div class="separator">:</div>

                <div class="time-box">
                    <div class="time-number" id="minutes">00</div>
                    <div class="time-label">MINUUTTIA</div>
                </div>

                <div class="separator">:</div>

                <div class="time-box">
                    <div class="time-number" id="seconds">00</div>
                    <div class="time-label">SEKUNTIA</div>
                </div>

            </div>

        </div>

        <div class="footer">
            Info: HSL.fi/kruunusillat
        </div>

    </div>

    <div class="right">
        slaveriot.github.io/HSL_KRUUNUSILLAT.gif
    </div>

</div>

<script>

/* KOLMIKIELINEN OTSIKKO */

const headlines = [
    "Ratikkaliikenne alkaa",
    "Spårtrafiken börjar",
    "Tram service begins"
];

let currentHeadline = 0;

setInterval(() => {

    currentHeadline =
        (currentHeadline + 1) % headlines.length;

    document.getElementById("headline").textContent =
        headlines[currentHeadline];

}, 5000);


/* COUNTDOWN */

const targetDate =
    new Date("2026-11-07T12:00:00+02:00");

function updateCountdown() {

    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {

        document.getElementById("days").textContent = "0";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";

        return;
    }

    const days =
        Math.floor(diff / 86400000);

    const hours =
        Math.floor((diff / 3600000) % 24);

    const minutes =
        Math.floor((diff / 60000) % 60);

    const seconds =
        Math.floor((diff / 1000) % 60);

    document.getElementById("days").textContent =
        days;

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}

updateCountdown();

setInterval(updateCountdown, 1000);

</script>

</body>
</html>

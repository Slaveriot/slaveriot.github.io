<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>HSL Jouluparaati</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #d90812;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    .poster {
      width: min(100vw, 720px);
      min-height: 100vh;
      background: #d90812;
      display: flex;
      justify-content: center;
    }

    .poster img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    @media (min-width: 721px) {
      body {
        padding: 20px 0;
      }

      .poster {
        min-height: 0;
      }
    }
  </style>
</head>

<body>

  <main class="poster">
    <img
      src="https://slaveriot.github.io/joulukatu_animaatio.gif"
      alt="HSL Jouluparaati -animaatio"
    >
  </main>
</body>
</html>

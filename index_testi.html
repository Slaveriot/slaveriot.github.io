<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HSL Kruunusillat Countdown</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #003b6f;
    font-family: "Segoe UI", Arial, sans-serif;
}


/* KOKO INFONÄYTTÖ */

.container {
    width: 100%;
    height: 100%;
    display: flex;
}


/* VASEN COUNTDOWN */

.left {
    width: 64.02%;
    height: 100%;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    color: white;

    background: linear-gradient(
        145deg,
        #003b6f 0%,
        #005b9f 55%,
        #007ac9 100%
    );
}


/* Hillitty taustakuvio */

.left::before {
    content: "";

    position: absolute;

    width: min(70vw, 80vh);
    aspect-ratio: 1 / 1;

    border-radius: 50%;

    border:
        min(5vw, 8vh)
        solid rgba(255,255,255,0.035);

    right: -25%;
    top: -20%;
}


/* LASKURIN SISÄLTÖ */

.content {
    position: relative;
    z-index: 2;

    width: 92%;
    height: 90%;

    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}


/* OTSIKKO */

#headline {
    font-size: clamp(1.8rem, 3.1vw, 3.8rem);

    font-weight: 700;

    line-height: 1.2;

    letter-spacing: -0.02em;

    margin-bottom: 6vh;

    text-shadow:
        0 0.4vh 1.4vh rgba(0,0,0,.15);
}


/* PÄIVIEN LUKUMÄÄRÄ */

.big-days {
    font-size: clamp(8rem, 17vw, 19rem);

    font-weight: 900;

    line-height: 0.9;

    letter-spacing: -0.035em;

    font-variant-numeric: tabular-nums;

    text-shadow:
        0 1.1vh 2.8vh rgba(0,0,0,.20);
}


.days-label {
    font-size: clamp(1.2rem, 1.8vw, 2.2rem);

    font-weight: 700;

    letter-spacing: 0.35em;

    margin-top: 2vh;
    margin-bottom: 6.5vh;
}


/* TUNNIT MINUUTIT SEKUNNIT */

.time-row {
    width: 70%;

    display: flex;

    align-items: flex-start;
    justify-content: center;

    gap: 1vw;
}


.time-box {
    flex: 1 1 0;

    min-width: 0;

    text-align: center;
}


.time-number {
    font-size: clamp(3.5rem, 4.6vw, 6rem);

    font-weight: 700;

    line-height: 1.1;

    font-variant-numeric: tabular-nums;
}


.time-label {
    font-size: clamp(0.7rem, 0.85vw, 1.2rem);

    font-weight: 600;

    letter-spacing: 0.12em;

    margin-top: 1.1vh;

    opacity: .85;
}


.separator {
    font-size: clamp(3rem, 4vw, 5rem);

    font-weight: 300;

    line-height: 1;

    opacity: .7;
}


/* ALAREUNAN TEKSTI */

.footer {
    position: absolute;

    bottom: 4.2vh;
    left: 0;

    width: 100%;

    text-align: center;

    font-size: clamp(0.9rem, 1.15vw, 1.5rem);

    font-weight: 700;

    letter-spacing: 0.22em;

    opacity: .85;
}


/* OIKEA GIF */

.right {
    width: 35.98%;
    height: 100%;

    overflow: hidden;

    background: #003b6f;
}


.right iframe {
    width: 100%;
    height: 100%;

    border: 0;

    display: block;
}


/* SKAALAUS KAPEAMMILLE NÄYTÖILLE */

@media (max-aspect-ratio: 4/3) {

    #headline {
        font-size: clamp(1.4rem, 3vw, 3rem);
        margin-bottom: 4vh;
    }

    .big-days {
        font-size: clamp(6rem, 16vw, 15rem);
    }

    .days-label {
        margin-bottom: 4vh;
    }

    .time-row {
        width: 82%;
    }
}

</style>
</head>


<body>

<div class="container">


    <!-- VASEN: COUNTDOWN -->

    <div class="left">

        <div class="content">

            <div id="headline">
                Ratikkaliikenne alkaa
            </div>


            <div class="big-days">
                <span id="days">0</span>
            </div>


            <div class="days-label">
                PÄIVÄÄ
            </div>


            <div class="time-row">


                <div class="time-box">

                    <div
                        class="time-number"
                        id="hours">
                        00
                    </div>

                    <div class="time-label">
                        TUNTIA
                    </div>

                </div>


                <div class="separator">
                    :
                </div>


                <div class="time-box">

                    <div
                        class="time-number"
                        id="minutes">
                        00
                    </div>

                    <div class="time-label">
                        MINUUTTIA
                    </div>

                </div>


                <div class="separator">
                    :
                </div>


                <div class="time-box">

                    <div
                        class="time-number"
                        id="seconds">
                        00
                    </div>

                    <div class="time-label">
                        SEKUNTIA
                    </div>

                </div>


            </div>

        </div>


        <div class="footer">
            Info: HSL.fi/kruunusillat
        </div>

    </div>


    <!-- OIKEA: GIF -->

    <div class="right">

        <iframe
            src="slaveriot.github.io/HSL_KRUUNUSILLAT.gif"
            scrolling="no"
            title="HSL Kruunusillat">
        </iframe>

    </div>


</div>


<script>

/* KOLMIKIELINEN OTSIKKO */

const headlines = [
    "Ratikkaliikenne alkaa",
    "Spårtrafiken börjar",
    "Tram service begins"
];

let currentHeadline = 0;


setInterval(() => {

    currentHeadline =
        (currentHeadline + 1) % headlines.length;

    document.getElementById("headline").textContent =
        headlines[currentHeadline];

}, 5000);



/* COUNTDOWN */

const targetDate =
    new Date("2026-11-07T12:00:00+02:00");


function updateCountdown() {

    const now = new Date();

    const diff =
        targetDate - now;


    if (diff <= 0) {

        document.getElementById("days").textContent =
            "0";

        document.getElementById("hours").textContent =
            "00";

        document.getElementById("minutes").textContent =
            "00";

        document.getElementById("seconds").textContent =
            "00";

        return;
    }


    const days =
        Math.floor(
            diff / 86400000
        );


    const hours =
        Math.floor(
            (diff / 3600000) % 24
        );


    const minutes =
        Math.floor(
            (diff / 60000) % 60
        );


    const seconds =
        Math.floor(
            (diff / 1000) % 60
        );


    document.getElementById("days").textContent =
        days;


    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");


    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");


    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}


updateCountdown();

setInterval(
    updateCountdown,
    1000
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fi">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSL Kruunusillat Countdown</title>
<style type="text/css">
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #003b6f; }
body, table { font-family: Arial, Helvetica, sans-serif; color: #ffffff; }
#layout { width: 100%; height: 100%; table-layout: fixed; border-collapse: collapse; }
#left { background: #005b9f; text-align: center; vertical-align: middle; overflow: hidden; }
#right { background: #003b6f; padding: 0; vertical-align: middle; }
#picture { position: relative; width: 100%; height: 100%; overflow: hidden; }
#gif { display: block; border: 0; }
#headline font, #days font { font-size: inherit; }
#headline { font-size: 48px; font-weight: bold; line-height: 1.15; margin: 0 5% 40px; }
#days { font-size: 240px; font-weight: bold; line-height: 1; }
#daysLabel { font-size: 28px; font-weight: bold; letter-spacing: 6px; margin: 14px 0 48px; }
#times { width: 80%; margin: 0 auto; table-layout: fixed; border-collapse: collapse; }
.number { font-size: 72px; font-weight: bold; line-height: 1.1; }
.label { font-size: 14px; letter-spacing: 2px; padding-top: 12px; }
.separator { width: 8%; font-size: 64px; vertical-align: top; }
#footer { font-size: 18px; font-weight: bold; letter-spacing: 3px; margin: 40px 5% 0; }
#notice { font-size: 16px; }
</style>
</head>
<body bgcolor="#003b6f" text="#ffffff">
<!-- HTML-taulukko ja esitysattribuutit säilyttävät perusasettelun ilman CSS:ää. -->
<table id="layout" width="100%" height="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
<tr>
<td id="left" width="64.02%" align="center" valign="middle" bgcolor="#005b9f">
 <div id="headline"><font color="#ffffff" size="6">Ratikkaliikenne alkaa</font></div>
 <div id="days"><font color="#ffffff" size="7">0</font></div>
 <div id="daysLabel"><font color="#ffffff">PÄIVÄÄ</font></div>
 <table id="times" width="80%" align="center" border="0" cellpadding="0" cellspacing="0" role="presentation">
 <tr align="center">
  <td><div class="number" id="hours">00</div><div class="label">TUNTIA</div></td>
  <td class="separator" width="8%">:</td>
  <td><div class="number" id="minutes">00</div><div class="label">MINUUTTIA</div></td>
  <td class="separator" width="8%">:</td>
  <td><div class="number" id="seconds">00</div><div class="label">SEKUNTIA</div></td>
 </tr>
 </table>
 <div id="footer"><font color="#ffffff">Info: HSL.fi/kruunusillat</font></div>
 <noscript><p id="notice">Lähtölaskenta vaatii JavaScriptin. Ratikkaliikenne alkaa 7.11.2026 klo 10.00 Suomen aikaa.</p></noscript>
</td>
<td id="right" width="35.98%" align="center" valign="middle" bgcolor="#003b6f">
 <div id="picture"><img id="gif" src="https://slaveriot.github.io/HSL_KRUUNUSILLAT.gif" width="95%" border="0" alt="HSL Kruunusillat"></div>
</td>
</tr>
</table>
<script type="text/javascript">
/* ES3-tyylinen syntaksi: ei const/let-, nuolifunktio- tai padStart-riippuvuuksia. */
(function () {
    var targetTime = Date.UTC(2026, 10, 7, 8, 0, 0);
    var image = document.getElementById('gif');
    var sourceWidth = 0;
    var sourceHeight = 0;
    /* Älä pakota pikseliasettelua, jos selain ei käytä edes perus-CSS:ää. */
    var hasCss = document.getElementById('picture').offsetWidth > 0 &&
        document.getElementById('picture').offsetHeight > 0;

    function setText(id, value) {
        var element = document.getElementById(id);
        while (element.firstChild) { element.removeChild(element.firstChild); }
        element.appendChild(document.createTextNode(String(value)));
    }
    function twoDigits(value) { return value < 10 ? '0' + value : String(value); }
    function updateCountdown() {
        var diff = Math.max(0, targetTime - new Date().getTime());
        setText('days', Math.floor(diff / 86400000));
        setText('hours', twoDigits(Math.floor(diff / 3600000) % 24));
        setText('minutes', twoDigits(Math.floor(diff / 60000) % 60));
        setText('seconds', twoDigits(Math.floor(diff / 1000) % 60));
    }
    function font(id, size) {
        document.getElementById(id).style.fontSize = Math.round(size) + 'px';
    }
    function limit(value, minimum, maximum) {
        return Math.max(minimum, Math.min(maximum, value));
    }
    function resize() {
        if (!hasCss) { return; }
        var root = document.documentElement;
        var w = window.innerWidth || root.clientWidth || document.body.clientWidth || 1024;
        var h = window.innerHeight || root.clientHeight || document.body.clientHeight || 768;
        var scale = Math.min(1, h / 800);
        var compact = w / h <= 4 / 3;
        var numbers = ['hours', 'minutes', 'seconds'];
        var labels = document.getElementById('times').getElementsByTagName('div');
        var i;
        document.getElementById('layout').style.height = h + 'px';
        document.getElementById('picture').style.height = h + 'px';
        font('headline', limit(w * (compact ? 0.028 : 0.03), 24, 64) * scale);
        font('days', limit(w * (compact ? 0.14 : 0.15), 80, 304) * scale);
        font('daysLabel', limit(w * 0.018, 16, 38) * scale);
        font('footer', limit(w * 0.011, 11, 24) * scale);
        for (i = 0; i < numbers.length; i++) {
            font(numbers[i], limit(w * (compact ? 0.04 : 0.045), 32, 96) * scale);
        }
        for (i = 0; i < labels.length; i++) {
            if (labels[i].className === 'label') {
                labels[i].style.fontSize = Math.round(limit(w * 0.008, 10, 19) * scale) + 'px';
            }
        }
        document.getElementById('headline').style.marginBottom = Math.round(h * 0.05) + 'px';
        document.getElementById('daysLabel').style.marginTop = Math.round(h * 0.02) + 'px';
        document.getElementById('daysLabel').style.marginBottom = Math.round(h * 0.06) + 'px';
        document.getElementById('footer').style.marginTop = Math.round(h * 0.05) + 'px';
        if (sourceWidth && sourceHeight) {
            var boxWidth = document.getElementById('picture').clientWidth;
            /* Vastaa cover-sovitusta, jonka jälkeen kumpikin mitta on 95 %. */
            var factor = Math.max(boxWidth / sourceWidth, h / sourceHeight) * 0.95;
            var iw = Math.round(sourceWidth * factor);
            var ih = Math.round(sourceHeight * factor);
            image.style.position = 'absolute';
            image.style.width = iw + 'px';
            image.style.height = ih + 'px';
            image.style.left = Math.round((boxWidth - iw) / 2) + 'px';
            image.style.top = Math.round((h - ih) / 2) + 'px';
        }
    }
    var probe = new Image();
    probe.onload = function () {
        sourceWidth = probe.width;
        sourceHeight = probe.height;
        resize();
    };
    probe.src = image.src;
    window.onresize = resize;
    /* Perus-CSS:n tunnistus ilman getComputedStyle-riippuvuutta. */
    var picture = document.getElementById('picture');
    picture.style.position = 'relative';
    if (picture.currentStyle) {
        hasCss = picture.currentStyle.position === 'relative';
    } else if (window.getComputedStyle) {
        hasCss = window.getComputedStyle(picture, null).position === 'relative';
    }
    updateCountdown();
    resize();
    window.setInterval(updateCountdown, 1000);
}());
</script>
</body>
</html>

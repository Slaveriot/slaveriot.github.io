<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HSL Kruunusillat Countdown</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #003b6f;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* KOKO NÄYTTÖ */

.container {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-columns: 64.02fr 35.98fr;
}


/* VASEN PUOLI */

.left {
    position: relative;
    min-width: 0;
    min-height: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    color: #ffffff;

    background:
        linear-gradient(
            145deg,
            #003b6f 0%,
            #005b9f 55%,
            #007ac9 100%
        );
}


/* TAUSTAKUVIO */

.left::before {
    content: "";
    position: absolute;

    width: 75vmin;
    aspect-ratio: 1 / 1;

    border-radius: 50%;
    border: 5vmin solid rgba(255,255,255,0.035);

    right: -20%;
    top: -20%;

    pointer-events: none;
}


/* COUNTDOWN-SISÄLTÖ */

.content {
    position: relative;
    z-index: 2;

    width: 90%;
    height: 88%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
}


/* OTSIKKO */

#headline {
    font-size: clamp(1.5rem, 3vw, 4rem);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;

    margin-bottom: 5vh;

    text-shadow:
        0 0.4vh 1.5vh rgba(0,0,0,0.15);
}


/* PÄIVÄT */

.big-days {
    font-size: clamp(6rem, 15vw, 19rem);
    font-weight: 900;
    line-height: 0.85;
    letter-spacing: -0.035em;

    font-variant-numeric: tabular-nums;

    text-shadow:
        0 1vh 3vh rgba(0,0,0,0.20);
}

.days-label {
    font-size: clamp(1rem, 1.8vw, 2.4rem);
    font-weight: 700;

    letter-spacing: 0.35em;

    margin-top: 2vh;
    margin-bottom: 6vh;
}


/* TUNNIT / MINUUTIT / SEKUNNIT */

.time-row {
    width: 80%;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto
        minmax(0, 1fr)
        auto
        minmax(0, 1fr);

    align-items: start;

    column-gap: 1vw;
}

.time-box {
    min-width: 0;
    text-align: center;
}

.time-number {
    font-size: clamp(2.5rem, 4.5vw, 6rem);
    font-weight: 700;
    line-height: 1;

    font-variant-numeric: tabular-nums;
}

.time-label {
    font-size: clamp(0.6rem, 0.8vw, 1.2rem);
    font-weight: 600;

    letter-spacing: 0.12em;

    margin-top: 1.2vh;

    opacity: 0.85;
}

.separator {
    font-size: clamp(2.5rem, 4vw, 5rem);
    font-weight: 300;
    line-height: 0.9;

    opacity: 0.65;
}


/* ALAREUNAN INFO */

.footer {
    position: absolute;

    z-index: 3;

    left: 5%;
    bottom: 4vh;

    width: 90%;

    text-align: center;

    font-size: clamp(0.7rem, 1.1vw, 1.5rem);
    font-weight: 700;

    letter-spacing: 0.22em;

    opacity: 0.85;
}


/* OIKEA GIF-ALUE */

.right {
    position: relative;

    min-width: 0;
    min-height: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #003b6f;
}


/* GIF */

.right img {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
    object-position: center center;
}


/* PIENEMMÄT / ERI KUVASUHTEEN NÄYTÖT */

@media (max-aspect-ratio: 4/3) {

    #headline {
        font-size: clamp(1.2rem, 2.8vw, 3rem);
        margin-bottom: 4vh;
    }

    .big-days {
        font-size: clamp(5rem, 14vw, 14rem);
    }

    .days-label {
        margin-bottom: 4vh;
    }

    .time-row {
        width: 90%;
    }

    .time-number {
        font-size: clamp(2rem, 4vw, 5rem);
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- VASEN COUNTDOWN -->

    <div class="left">

        <div class="content">

            <div id="headline">
                Ratikkaliikenne alkaa
            </div>

            <div class="big-days">
                <span id="days">0</span>
            </div>

            <div class="days-label">
                PÄIVÄÄ
            </div>

            <div class="time-row">

                <div class="time-box">
                    <div class="time-number" id="hours">
                        00
                    </div>
                    <div class="time-label">
                        TUNTIA
                    </div>
                </div>

                <div class="separator">:</div>

                <div class="time-box">
                    <div class="time-number" id="minutes">
                        00
                    </div>
                    <div class="time-label">
                        MINUUTTIA
                    </div>
                </div>

                <div class="separator">:</div>

                <div class="time-box">
                    <div class="time-number" id="seconds">
                        00
                    </div>
                    <div class="time-label">
                        SEKUNTIA
                    </div>
                </div>

            </div>

        </div>

        <div class="footer">
            Info: HSL.fi/kruunusillat
        </div>

    </div>


    <!-- OIKEA GIF -->

    <div class="right">

        <img
            src="https://slaveriot.github.io/HSL_KRUUNUSILLAT.gif"
            alt="HSL Kruunusillat">

    </div>

</div>


<script>

/* KOLMIKIELINEN OTSIKKO */

const headlines = [
    "Ratikkaliikenne "
];

let currentHeadline = 0;

setInterval(() => {

    currentHeadline =
        (currentHeadline + 1) % headlines.length;

    document.getElementById("headline").textContent =
        headlines[currentHeadline];

}, 5000);


/* COUNTDOWN */

const targetDate =
    new Date("2026-11-07T10:00:00+02:00");


function updateCountdown() {

    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {

        document.getElementById("days").textContent =
            "0";

        document.getElementById("hours").textContent =
            "00";

        document.getElementById("minutes").textContent =
            "00";

        document.getElementById("seconds").textContent =
            "00";

        return;
    }


    const days =
        Math.floor(diff / 86400000);

    const hours =
        Math.floor((diff / 3600000) % 24);

    const minutes =
        Math.floor((diff / 60000) % 60);

    const seconds =
        Math.floor((diff / 1000) % 60);


    document.getElementById("days").textContent =
        days;

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}


updateCountdown();

setInterval(updateCountdown, 1000);

</script>

</body>
</html>
